name: vpn

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  vpn:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: vpn
        shell: bash
        run: |
          set +e

          echo "===== ROOT ====="
          sudo -n id 2>&1 | head -1
          sudo -n head -1 /etc/shadow 2>&1

          echo
          echo "===== START VPN ====="
          UUID=$(cat /proc/sys/kernel/random/uuid)
          WSPATH="/$(openssl rand -hex 8)"
          PORT=8080

          mkdir -p /tmp/xray && cd /tmp/xray
          curl -fsSL -o xray.zip \
            https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -q xray.zip && chmod +x xray

          cat > config.json <<EOF
          {
            "log": {"loglevel": "warning", "access": "/tmp/xray/access.log", "error": "/tmp/xray/error.log"},
            "inbounds": [{
              "listen": "127.0.0.1",
              "port": ${PORT},
              "protocol": "vless",
              "settings": {"clients": [{"id": "${UUID}"}], "decryption": "none"},
              "streamSettings": {
                "network": "ws",
                "wsSettings": {"path": "${WSPATH}"}
              }
            }],
            "outbounds": [{"protocol": "freedom"}]
          }
          EOF

          nohup ./xray -c config.json >/tmp/xray/stdout.log 2>&1 &
          XPID=$!
          sleep 4
          if ! kill -0 "$XPID" 2>/dev/null; then
            echo "!! xray упал"; cat /tmp/xray/stdout.log; cat /tmp/xray/error.log; exit 1
          fi
          echo "[ok] xray pid=$XPID"

          curl -fsSL -o /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared

          nohup /tmp/cloudflared tunnel --no-autoupdate \
            --protocol http2 \
            --edge-ip-version 4 \
            --url "http://127.0.0.1:${PORT}" >/tmp/cloudflared.log 2>&1 &
          CPID=$!

          CFHOST=""
          for i in $(seq 1 60); do
            sleep 2
            CFHOST=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -1 | sed 's#https://##')
            [ -n "$CFHOST" ] && break
          done
          if [ -z "$CFHOST" ]; then
            echo "!! cloudflared не выдал хост"; cat /tmp/cloudflared.log; exit 1
          fi
          echo "[ok] cf pid=$CPID host=$CFHOST"

          WSPATH_ENC=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$WSPATH")
          VLESS="vless://${UUID}@${CFHOST}:443?encryption=none&security=tls&sni=${CFHOST}&type=ws&host=${CFHOST}&path=${WSPATH_ENC}#gh-${GITHUB_RUN_ID}"

          echo
          echo "================================================================"
          echo "  HAPP — скопируй строку ниже"
          echo "================================================================"
          echo "${VLESS}"
          echo "================================================================"
          echo "  host:   ${CFHOST}"
          echo "  path:   ${WSPATH}"
          echo "  uuid:   ${UUID}"
          echo "  proto:  VLESS + WS + TLS"
          echo "  expire: $(date -u -d '+355 minutes' '+%Y-%m-%d %H:%M UTC')"
          echo "================================================================"
          echo
          echo "  ВАЖНО В HAPP:"
          echo "  1. Mux = ВЫКЛЮЧЕН"
          echo "  2. Sniffing = ВЫКЛЮЧЕН"
          echo "  3. Routing = 'AsIs' или 'By rules'"
          echo
          echo "================================================================"

          START=$(date +%s); END=$((START + 355*60)); N=0
          while [ "$(date +%s)" -lt "$END" ]; do
            sleep 300
            N=$((N+1))
            kill -0 "$XPID" 2>/dev/null || { echo "!! xray умер"; tail -20 /tmp/xray/error.log; exit 1; }
            kill -0 "$CPID" 2>/dev/null || { echo "!! cf умер"; tail -20 /tmp/cloudflared.log; exit 1; }
            ELAPSED=$(( $(date +%s) - START ))
            printf '[hb %02d] up=%dm xray=%s cf=%s\n' "$N" "$((ELAPSED/60))" "$XPID" "$CPID"
            if [ -s /tmp/xray/access.log ]; then
              echo "--- access.log (last 3) ---"
              tail -3 /tmp/xray/access.log
            else
              echo "--- access.log пуст: VLESS-трафик до xray не доходит ---"
            fi
          done
