name: vpn-node

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */5 * * *"
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: vpn-node
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      RUN_MINUTES: "320"
      WS_PATH: "/gh-vpn"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install xray and cloudflared
        run: |
          set -euo pipefail
          mkdir -p bin
          curl -fsSL -o /tmp/xray.zip \
            https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -q -o /tmp/xray.zip -d bin
          curl -fsSL -o bin/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x bin/xray bin/cloudflared
          ./bin/xray version
          ./bin/cloudflared --version

      - name: Start xray
        run: |
          set -euo pipefail
          UUID=$(cat /proc/sys/kernel/random/uuid)
          echo "UUID=$UUID" >> "$GITHUB_ENV"

          cat > xray.json <<EOF
          {
            "log": { "loglevel": "warning" },
            "inbounds": [
              {
                "listen": "127.0.0.1",
                "port": 10000,
                "protocol": "vless",
                "settings": {
                  "clients": [ { "id": "$UUID" } ],
                  "decryption": "none"
                },
                "streamSettings": {
                  "network": "ws",
                  "wsSettings": { "path": "$WS_PATH" }
                }
              }
            ],
            "outbounds": [
              { "protocol": "freedom", "tag": "direct" },
              { "protocol": "blackhole", "tag": "block" }
            ]
          }
          EOF

          nohup ./bin/xray run -c xray.json > xray.log 2>&1 &
          echo $! > xray.pid
          sleep 3
          kill -0 "$(cat xray.pid)"
          ss -ltn | grep 10000

      - name: Start cloudflared tunnel
        run: |
          set -euo pipefail
          nohup ./bin/cloudflared tunnel --no-autoupdate --protocol http2 \
            --url http://127.0.0.1:10000 > cf.log 2>&1 &
          echo $! > cf.pid

          HOST=""
          for _ in $(seq 1 60); do
            HOST=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' cf.log | head -n1 || true)
            [ -n "$HOST" ] && break
            sleep 2
          done

          if [ -z "$HOST" ]; then
            echo "no tunnel hostname assigned"
            tail -n 50 cf.log
            exit 1
          fi

          HOST="${HOST#https://}"
          echo "HOST=$HOST" >> "$GITHUB_ENV"
          echo "tunnel host: $HOST"

      - name: Publish HAPP subscription
        run: |
          set -euo pipefail
          ENC_PATH=$(printf '%s' "$WS_PATH" | sed 's|/|%2F|g')
          LINK="vless://${UUID}@${HOST}:443?encryption=none&security=tls&sni=${HOST}&fp=chrome&type=ws&host=${HOST}&path=${ENC_PATH}#gh-actions-vpn"
          printf '%s' "$LINK" | base64 -w0 > sub.txt

          RAW="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/sub.txt"
          CDN="https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/sub.txt"

          {
            echo "### VPN node up"
            echo
            echo '```'
            echo "$LINK"
            echo '```'
            echo
            echo "- Subscription (raw): $RAW"
            echo "- Subscription (jsDelivr): $CDN"
            echo "- Node lifetime: ${RUN_MINUTES} minutes from now"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::notice title=HAPP subscription::${RAW}"
          echo "$LINK"

      - name: Commit subscription
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sub.txt
          git commit -m "vpn node $(date -u +%FT%TZ)" || echo "nothing to commit"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Keep alive
        run: |
          set -euo pipefail
          END=$(( $(date +%s) + RUN_MINUTES * 60 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            kill -0 "$(cat xray.pid)" 2>/dev/null || { echo "xray died"; tail -n 30 xray.log; exit 1; }
            kill -0 "$(cat cf.pid)"   2>/dev/null || { echo "cloudflared died"; tail -n 30 cf.log; exit 1; }
            sleep 60
          done
          echo "lifetime reached, exiting for the next scheduled run"
