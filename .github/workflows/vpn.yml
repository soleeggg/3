name: vpn

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  vpn:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: vpn
        shell: bash
        run: |
          set +e

          UUID=$(cat /proc/sys/kernel/random/uuid)
          WSPATH="/$(openssl rand -hex 8)"
          PORT=8080

          mkdir -p /tmp/xray && cd /tmp/xray
          curl -fsSL -o xray.zip \
            https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -q xray.zip && chmod +x xray

          cat > config.json <<EOF
          {
            "log": {"loglevel": "debug", "access": "/tmp/xray/access.log", "error": "/tmp/xray/error.log"},
            "inbounds": [{
              "listen": "127.0.0.1",
              "port": ${PORT},
              "protocol": "vless",
              "settings": {"clients": [{"id": "${UUID}"}], "decryption": "none"},
              "streamSettings": {
                "network": "ws",
                "wsSettings": {"path": "${WSPATH}"}
              },
              "sniffing": {
                "enabled": true,
                "destOverride": ["http", "tls", "quic"],
                "routeOnly": false
              }
            }],
            "outbounds": [
              {"protocol": "freedom", "tag": "direct", "settings": {"domainStrategy": "UseIPv4"}},
              {"protocol": "blackhole", "tag": "block"}
            ],
            "dns": {
              "servers": ["1.1.1.1", "8.8.8.8"]
            }
          }
          EOF

          nohup ./xray -c config.json >/tmp/xray/stdout.log 2>&1 &
          sleep 3
          pgrep -f '/tmp/xray/xray' >/dev/null || { echo "!! xray упал"; cat /tmp/xray/stdout.log; exit 1; }

          curl -fsSL -o /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared

          # КЛЮЧЕВОЕ: --protocol http2 вместо дефолтного QUIC
          nohup /tmp/cloudflared tunnel --no-autoupdate \
            --protocol http2 \
            --edge-ip-version 4 \
            --url "http://127.0.0.1:${PORT}" >/tmp/cloudflared.log 2>&1 &
          sleep 25

          CFHOST=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -1 | sed 's#https://##')
          if [ -z "${CFHOST:-}" ]; then
            echo "!! cloudflared не стартанул:"
            cat /tmp/cloudflared.log
            exit 1
          fi

          # fp=chrome + alpn=http/1.1 — не даём клиенту негоциировать h2 на CF
          VLESS="vless://${UUID}@${CFHOST}:443?encryption=none&security=tls&sni=${CFHOST}&type=ws&host=${CFHOST}&path=${WSPATH}&fp=chrome&alpn=http%2F1.1#gh-${GITHUB_RUN_ID}"

          echo
          echo "================================================================"
          echo "  HAPP — скопируй строку ниже"
          echo "================================================================"
          echo "${VLESS}"
          echo "================================================================"
          echo "  host:   ${CFHOST}"
          echo "  path:   ${WSPATH}"
          echo "  uuid:   ${UUID}"
          echo "  expire: $(date -u -d '+355 minutes' '+%Y-%m-%d %H:%M UTC')"
          echo "================================================================"
          echo

          START=$(date +%s)
          END=$((START + 355*60))
          N=0
          while [ "$(date +%s)" -lt "$END" ]; do
            sleep 300
            N=$((N+1))
            X=$(pgrep -f '/tmp/xray/xray' | head -1)
            C=$(pgrep -f '/tmp/cloudflared' | head -1)
            if [ -z "${X:-}" ] || [ -z "${C:-}" ]; then
              echo "!! процесс упал: xray=${X:-none} cf=${C:-none}"
              tail -30 /tmp/xray/error.log
              tail -30 /tmp/cloudflared.log
              exit 1
            fi
            ELAPSED=$(( $(date +%s) - START ))
            printf '[heartbeat %02d] up=%dm  xray=%s cf=%s  %s\n' \
              "$N" "$((ELAPSED/60))" "$X" "$C" "$(date -u '+%H:%M:%S')"
            # если клиент подключался — покажем последние строки access.log
            if [ -f /tmp/xray/access.log ]; then
              echo "--- access.log (last 5) ---"
              tail -5 /tmp/xray/access.log
            fi
          done
