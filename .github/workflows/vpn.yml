name: vpn

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  vpn:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: vpn
        shell: bash
        run: |
          set +e

          echo "===== ROOT ====="
          sudo -n id | head -1

          UUID=$(cat /proc/sys/kernel/random/uuid)
          WSPATH="/$(openssl rand -hex 8)"
          PORT=8080

          mkdir -p /tmp/xray && cd /tmp/xray
          curl -fsSL -o xray.zip \
            https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -q xray.zip && chmod +x xray

          # wsSettings с keepalive: каждые 20с пингуем, чтобы CF не счёл поток idle
          cat > config.json <<EOF
          {
            "log": {
              "loglevel": "info",
              "access": "/tmp/xray/access.log",
              "error":  "/tmp/xray/error.log"
            },
            "inbounds": [{
              "listen": "127.0.0.1",
              "port": ${PORT},
              "protocol": "vless",
              "settings": {"clients": [{"id": "${UUID}"}], "decryption": "none"},
              "streamSettings": {
                "network": "ws",
                "wsSettings": {
                  "path": "${WSPATH}",
                  "heartbeatPeriod": 20
                }
              }
            }],
            "outbounds": [
              {"protocol": "freedom", "settings": {"domainStrategy": "UseIP"}}
            ],
            "policy": {
              "levels": {"0": {"handshake": 4, "connIdle": 300, "uplinkOnly": 2, "downlinkOnly": 2}}
            }
          }
          EOF

          nohup ./xray -c config.json >/tmp/xray/stdout.log 2>&1 &
          XPID=$!
          sleep 4
          kill -0 "$XPID" 2>/dev/null || { echo "!! xray упал"; cat /tmp/xray/stdout.log; cat /tmp/xray/error.log; exit 1; }
          echo "[ok] xray pid=$XPID"

          curl -fsSL -o /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared

          # QUIC + несколько HA-соединений + ретраи — resilience к дропам CF-края
          nohup /tmp/cloudflared tunnel --no-autoupdate \
            --protocol quic \
            --ha-connections 4 \
            --retries 10 \
            --loglevel info \
            --url "http://127.0.0.1:${PORT}" >/tmp/cloudflared.log 2>&1 &
          CPID=$!

          CFHOST=""
          for i in $(seq 1 60); do
            sleep 2
            CFHOST=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -1 | sed 's#https://##')
            [ -n "$CFHOST" ] && break
          done
          [ -z "$CFHOST" ] && { echo "!! cf не выдал хост"; tail -40 /tmp/cloudflared.log; exit 1; }
          echo "[ok] cf pid=$CPID host=$CFHOST"

          WSPATH_ENC=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$WSPATH")
          VLESS="vless://${UUID}@${CFHOST}:443?encryption=none&security=tls&sni=${CFHOST}&type=ws&host=${CFHOST}&path=${WSPATH_ENC}#gh-${GITHUB_RUN_ID}"

          echo
          echo "================================================================"
          echo "  HAPP — скопируй строку ниже"
          echo "================================================================"
          echo "${VLESS}"
          echo "================================================================"
          echo "  host:   ${CFHOST}"
          echo "  path:   ${WSPATH}"
          echo "  uuid:   ${UUID}"
          echo "  expire: $(date -u -d '+355 minutes' '+%Y-%m-%d %H:%M UTC')"
          echo "================================================================"
          echo "  В HAPP: Mux = ВЫКЛ, Sniffing = ВЫКЛ, FP = chrome"
          echo "================================================================"
          echo

          START=$(date +%s); END=$((START + 355*60)); N=0
          while [ "$(date +%s)" -lt "$END" ]; do
            sleep 60
            N=$((N+1))
            kill -0 "$XPID" 2>/dev/null || { echo "!! xray умер"; tail -30 /tmp/xray/error.log; exit 1; }
            kill -0 "$CPID" 2>/dev/null || { echo "!! cf умер"; tail -30 /tmp/cloudflared.log; exit 1; }

            ELAPSED=$(( $(date +%s) - START ))
            ACC=$(wc -l < /tmp/xray/access.log 2>/dev/null || echo 0)
            ERR_CLOSE=$(grep -c "1006\|use of closed" /tmp/xray/error.log 2>/dev/null || echo 0)
            CF_RECONN=$(grep -c "Registered tunnel connection\|Retrying" /tmp/cloudflared.log 2>/dev/null || echo 0)
            printf '[hb %02d] up=%dm  accepted=%s  1006_errors=%s  cf_reconnects=%s\n' \
              "$N" "$((ELAPSED/60))" "$ACC" "$ERR_CLOSE" "$CF_RECONN"
            if [ -s /tmp/xray/access.log ]; then
              echo "  last: $(tail -1 /tmp/xray/access.log)"
            fi
          done
