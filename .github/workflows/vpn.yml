name: vpn

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  vpn:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: vpn
        shell: bash
        run: |
          set +e

          UUID=$(cat /proc/sys/kernel/random/uuid)
          XPATH="/$(openssl rand -hex 8)"
          PORT=8080

          mkdir -p /tmp/xray && cd /tmp/xray
          curl -fsSL -o xray.zip \
            https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -q xray.zip && chmod +x xray

          cat > config.json <<EOF
          {
            "log": {"loglevel": "info", "access": "/tmp/xray/access.log", "error": "/tmp/xray/error.log"},
            "inbounds": [{
              "listen": "127.0.0.1",
              "port": ${PORT},
              "protocol": "vless",
              "settings": {"clients": [{"id": "${UUID}"}], "decryption": "none"},
              "streamSettings": {
                "network": "xhttp",
                "xhttpSettings": {"path": "${XPATH}"}
              },
              "sniffing": {
                "enabled": true,
                "destOverride": ["http", "tls", "quic"]
              }
            }],
            "outbounds": [
              {"protocol": "freedom", "tag": "direct"}
            ]
          }
          EOF

          nohup ./xray -c config.json >/tmp/xray/stdout.log 2>&1 &
          sleep 3

          if ! pgrep -f '/tmp/xray/xray' >/dev/null; then
            echo "!! xray упал"
            echo "=== stdout.log ==="
            cat /tmp/xray/stdout.log
            echo "=== error.log ==="
            cat /tmp/xray/error.log 2>/dev/null
            exit 1
          fi
          echo "[ok] xray запущен, pid=$(pgrep -f '/tmp/xray/xray' | head -1)"

          curl -fsSL -o /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared

          nohup /tmp/cloudflared tunnel --no-autoupdate \
            --protocol http2 \
            --edge-ip-version 4 \
            --url "http://127.0.0.1:${PORT}" >/tmp/cloudflared.log 2>&1 &
          sleep 25

          CFHOST=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -1 | sed 's#https://##')
          if [ -z "${CFHOST:-}" ]; then
            echo "!! cloudflared не стартанул:"
            cat /tmp/cloudflared.log
            exit 1
          fi

          VLESS="vless://${UUID}@${CFHOST}:443?encryption=none&security=tls&sni=${CFHOST}&type=xhttp&host=${CFHOST}&path=${XPATH}&mode=auto#gh-${GITHUB_RUN_ID}"

          echo
          echo "================================================================"
          echo "  HAPP — скопируй строку ниже"
          echo "================================================================"
          echo "${VLESS}"
          echo "================================================================"
          echo "  host:   ${CFHOST}"
          echo "  path:   ${XPATH}"
          echo "  uuid:   ${UUID}"
          echo "  proto:  XHTTP"
          echo "  expire: $(date -u -d '+355 minutes' '+%Y-%m-%d %H:%M UTC')"
          echo "================================================================"
          echo

          START=$(date +%s)
          END=$((START + 355*60))
          N=0
          while [ "$(date +%s)" -lt "$END" ]; do
            sleep 300
            N=$((N+1))
            X=$(pgrep -f '/tmp/xray/xray' | head -1)
            C=$(pgrep -f '/tmp/cloudflared' | head -1)
            if [ -z "${X:-}" ] || [ -z "${C:-}" ]; then
              echo "!! процесс упал: xray=${X:-none} cf=${C:-none}"
              tail -30 /tmp/xray/error.log
              tail -30 /tmp/cloudflared.log
              exit 1
            fi
            ELAPSED=$(( $(date +%s) - START ))
            printf '[heartbeat %02d] up=%dm  xray=%s cf=%s  %s\n' \
              "$N" "$((ELAPSED/60))" "$X" "$C" "$(date -u '+%H:%M:%S')"
            if [ -s /tmp/xray/access.log ]; then
              echo "--- access.log (last 3) ---"
              tail -3 /tmp/xray/access.log
            fi
          done
