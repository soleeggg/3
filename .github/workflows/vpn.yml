name: vpn

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  vpn:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: vpn
        shell: bash
        run: |
          set +e

          echo "===== ROOT ====="
          sudo -n id | head -1

          UUID=$(cat /proc/sys/kernel/random/uuid)
          XPATH="/$(openssl rand -hex 8)"
          PORT=8080

          mkdir -p /tmp/xray && cd /tmp/xray
          curl -fsSL -o xray.zip \
            https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -q xray.zip && chmod +x xray

          # XHTTP packet-up: короткие POST'ы, CF их не дропает.
          # xPaddingBytes + scMaxEachPostBytes — маскировка под обычный REST.
          cat > config.json <<EOF
          {
            "log": {
              "loglevel": "info",
              "access": "/tmp/xray/access.log",
              "error":  "/tmp/xray/error.log"
            },
            "inbounds": [{
              "listen": "127.0.0.1",
              "port": ${PORT},
              "protocol": "vless",
              "settings": {
                "clients": [{"id": "${UUID}"}],
                "decryption": "none"
              },
              "streamSettings": {
                "network": "xhttp",
                "xhttpSettings": {
                  "path": "${XPATH}",
                  "mode": "packet-up",
                  "scMaxEachPostBytes": 1000000,
                  "scMinPostsIntervalMs": 30,
                  "xPaddingBytes": "100-1000"
                }
              }
            }],
            "outbounds": [
              {"protocol": "freedom", "settings": {"domainStrategy": "UseIP"}}
            ]
          }
          EOF

          nohup ./xray -c config.json >/tmp/xray/stdout.log 2>&1 &
          XPID=$!
          sleep 4
          kill -0 "$XPID" 2>/dev/null || { echo "!! xray упал"; cat /tmp/xray/stdout.log; cat /tmp/xray/error.log; exit 1; }
          echo "[ok] xray pid=$XPID"
          echo "--- xray error.log ---"
          tail -5 /tmp/xray/error.log

          curl -fsSL -o /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared

          nohup /tmp/cloudflared tunnel --no-autoupdate \
            --protocol quic \
            --ha-connections 4 \
            --retries 10 \
            --url "http://127.0.0.1:${PORT}" >/tmp/cloudflared.log 2>&1 &
          CPID=$!

          CFHOST=""
          for i in $(seq 1 60); do
            sleep 2
            CFHOST=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -1 | sed 's#https://##')
            [ -n "$CFHOST" ] && break
          done
          [ -z "$CFHOST" ] && { echo "!! cf не выдал хост"; tail -40 /tmp/cloudflared.log; exit 1; }
          echo "[ok] cf pid=$CPID host=$CFHOST"

          XPATH_ENC=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$XPATH")

          # type=xhttp + mode=packet-up + extra-параметры паддинга
          VLESS="vless://${UUID}@${CFHOST}:443?encryption=none&security=tls&sni=${CFHOST}&type=xhttp&host=${CFHOST}&path=${XPATH_ENC}&mode=packet-up&x_padding_bytes=100-1000#gh-${GITHUB_RUN_ID}"

          echo
          echo "================================================================"
          echo "  HAPP — скопируй строку ниже"
          echo "================================================================"
          echo "${VLESS}"
          echo "================================================================"
          echo "  host:   ${CFHOST}"
          echo "  path:   ${XPATH}"
          echo "  uuid:   ${UUID}"
          echo "  proto:  VLESS + XHTTP (packet-up) + TLS"
          echo "  expire: $(date -u -d '+355 minutes' '+%Y-%m-%d %H:%M UTC')"
          echo "================================================================"
          echo "  В HAPP:"
          echo "   - Transport = xhttp (не ws!)"
          echo "   - Mode = packet-up"
          echo "   - Mux = ВЫКЛ, Sniffing = ВЫКЛ, FP = chrome"
          echo "================================================================"
          echo

          START=$(date +%s); END=$((START + 355*60)); N=0
          while [ "$(date +%s)" -lt "$END" ]; do
            sleep 60
            N=$((N+1))
            kill -0 "$XPID" 2>/dev/null || { echo "!! xray умер"; tail -30 /tmp/xray/error.log; exit 1; }
            kill -0 "$CPID" 2>/dev/null || { echo "!! cf умер"; tail -30 /tmp/cloudflared.log; exit 1; }

            ELAPSED=$(( $(date +%s) - START ))
            ACC=$(wc -l < /tmp/xray/access.log 2>/dev/null || echo 0)
            ERRS=$(grep -c "1006\|closed\|EOF" /tmp/xray/error.log 2>/dev/null || echo 0)
            CF_RECONN=$(grep -c "Retrying\|Registered" /tmp/cloudflared.log 2>/dev/null || echo 0)
            printf '[hb %02d] up=%dm accepted=%s errors=%s cf_evt=%s\n' \
              "$N" "$((ELAPSED/60))" "$ACC" "$ERRS" "$CF_RECONN"
            [ -s /tmp/xray/access.log ] && echo "  last: $(tail -1 /tmp/xray/access.log)"
          done
